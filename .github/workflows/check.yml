name: Validate Gather
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gather
          POSTGRES_PASSWORD: gather
          POSTGRES_DB: gather_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gather -d gather_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://gather:gather@localhost:5432/gather_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test test/
      - run: bun run build
