services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: gather
      POSTGRES_DB: gather
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - gather-postgres:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gather -d gather"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  gather-postgres:
